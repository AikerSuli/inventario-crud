<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input { margin: 4px; padding: 6px; }
    button { padding: 6px 10px; cursor: pointer; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Inventario de productos</h1>

  <h2 id="titulo">Agregar producto</h2>
  <form id="formulario">
    <input type="hidden" id="id">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="number" id="precio" placeholder="Precio" step="0.01">
    <input type="number" id="stock" placeholder="Stock">
    <button type="submit">Guardar</button>
  </form>

  <h2>Lista de productos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <script>
    let productos = [];

    async function cargarProductos() {
      const respuesta = await fetch('/productos');
      productos = await respuesta.json();

      const tabla = document.getElementById('tabla');
      tabla.innerHTML = '';
      productos.forEach(p => {
        tabla.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>$${p.precio}</td>
            <td>${p.stock}</td>
            <td>
              <button onclick="editar(${p.id})">Editar</button>
              <button onclick="eliminar(${p.id})">Eliminar</button>
            </td>
          </tr>`;
      });
    }

    document.getElementById('formulario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('id').value;
      const producto = {
        nombre: document.getElementById('nombre').value,
        precio: document.getElementById('precio').value,
        stock: document.getElementById('stock').value
      };

      // Si hay un id se edita el producto, si no se crea uno nuevo
      const respuesta = await fetch(id ? '/productos/' + id : '/productos', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(producto)
      });
      if (!respuesta.ok) {
        const error = await respuesta.json();
        alert(error.mensaje);
        return;
      }

      document.getElementById('formulario').reset();
      document.getElementById('id').value = '';
      document.getElementById('titulo').textContent = 'Agregar producto';
      cargarProductos();
    });

    function editar(id) {
      const producto = productos.find(p => p.id === id);
      document.getElementById('id').value = producto.id;
      document.getElementById('nombre').value = producto.nombre;
      document.getElementById('precio').value = producto.precio;
      document.getElementById('stock').value = producto.stock;
      document.getElementById('titulo').textContent = 'Editar producto';
    }

    async function eliminar(id) {
      if (!confirm('¿Seguro que quieres eliminar este producto?')) return;
      await fetch('/productos/' + id, { method: 'DELETE' });
      cargarProductos();
    }

    cargarProductos();
  </script>
</body>
</html>
